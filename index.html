<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELMA Transmart Pekalongan — Product Catalog 2026</title>
  <meta name="description" content="Product Catalog 2026 — SELMA Transmart Pekalongan LT 1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      background: #a91f2b;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 10px rgba(0,0,0,.3);
    }
    .brand { font-weight: 700; letter-spacing: .3px; }
    .sub { font-size: 12px; opacity: .9; margin-top: 2px; }
    .actions { display: flex; gap: 8px; }
    button, .open-pdf {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      background: #fff;
      color: #8f1d27;
      font-weight: 700;
      text-decoration: none;
      font-size: 13px;
    }
    .viewer {
      min-height: calc(100vh - 58px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 12px 26px;
    }
    #book {
      width: min(94vw, 1100px);
      height: min(82vh, 760px);
      min-height: 420px;
      margin: 0 auto;
    }
    .page {
      background: #fff;
      overflow: hidden;
      box-shadow: 0 0 14px rgba(0,0,0,.25);
    }
    .page canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: white;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .controls button {
      min-width: 110px;
    }
    #counter {
      min-width: 100px;
      text-align: center;
      font-size: 13px;
      color: #ddd;
    }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      z-index: 50;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 42px; height: 42px;
      border: 4px solid #555;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint {
      margin-top: 10px;
      color: #aaa;
      font-size: 12px;
      text-align: center;
    }
    @media (max-width: 700px) {
      .topbar { height: 54px; padding: 0 10px; }
      .brand { font-size: 14px; }
      .sub { font-size: 10px; }
      .topbar .open-pdf { padding: 7px 9px; font-size: 11px; }
      #book {
        width: 96vw;
        height: 76vh;
        min-height: 360px;
      }
      .viewer { padding-top: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">SELMA</div>
      <div class="sub">TRANSMART PEKALONGAN LT 1 · PRODUCT CATALOG 2026</div>
    </div>
    <div class="actions">
      <a class="open-pdf" href="katalog.pdf" target="_blank" rel="noopener">Buka PDF</a>
      <button id="fullscreenBtn" type="button">Fullscreen</button>
    </div>
  </header>

  <main class="viewer">
    <div id="book"></div>
    <div class="controls">
      <button id="prevBtn" type="button">‹ Sebelumnya</button>
      <span id="counter">Memuat…</span>
      <button id="nextBtn" type="button">Berikutnya ›</button>
    </div>
    <div class="hint">Klik/geser sudut halaman untuk membalik seperti buku.</div>
  </main>

  <div id="status">
    <div class="spinner"></div>
    <div id="statusText">Menyiapkan katalog…</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const bookEl = document.getElementById("book");
    const counter = document.getElementById("counter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    let flipbook;
    let totalPages = 0;

    function setStatus(text) {
      statusText.textContent = text;
    }

    function updateCounter(current) {
      counter.textContent = `Halaman ${current} / ${totalPages}`;
    }

    async function renderPage(pdf, pageNum, canvas) {
      const page = await pdf.getPage(pageNum);
      const baseViewport = page.getViewport({ scale: 1 });
      const targetWidth = 1050;
      const scale = Math.min(2.0, Math.max(1.2, targetWidth / baseViewport.width));
      const viewport = page.getViewport({ scale });

      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(viewport.width * ratio);
      canvas.height = Math.floor(viewport.height * ratio);
      canvas.style.width = "100%";
      canvas.style.height = "100%";

      const ctx = canvas.getContext("2d", { alpha: false });
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    async function init() {
      try {
        setStatus("Membuka katalog PDF…");
        const loadingTask = pdfjsLib.getDocument("katalog.pdf");
        const pdf = await loadingTask.promise;
        totalPages = pdf.numPages;

        const pages = [];
        for (let i = 1; i <= totalPages; i++) {
          const page = document.createElement("div");
          page.className = "page";
          const canvas = document.createElement("canvas");
          page.appendChild(canvas);
          bookEl.appendChild(page);
          pages.push({ page, canvas, num: i });
        }

        setStatus(`Merender 0 / ${totalPages} halaman…`);
        for (let i = 0; i < pages.length; i++) {
          await renderPage(pdf, pages[i].num, pages[i].canvas);
          setStatus(`Merender ${i + 1} / ${totalPages} halaman…`);
        }

        const rect = bookEl.getBoundingClientRect();
        const portraitRatio = 1.414;
        const pageWidth = Math.max(300, Math.floor(Math.min(rect.width / 2, rect.height / portraitRatio)));

        flipbook = new St.PageFlip(bookEl, {
          width: pageWidth,
          height: Math.floor(pageWidth * portraitRatio),
          size: "stretch",
          minWidth: 280,
          maxWidth: 900,
          minHeight: 396,
          maxHeight: 1273,
          maxShadowOpacity: 0.35,
          showCover: true,
          mobileScrollSupport: true,
          useMouseEvents: true,
          drawShadow: true,
          flippingTime: 700,
          startPage: 0
        });

        flipbook.loadFromHTML(document.querySelectorAll(".page"));
        flipbook.on("flip", e => updateCounter(e.data + 1));
        updateCounter(1);

        status.style.display = "none";
      } catch (err) {
        console.error(err);
        status.innerHTML = `
          <div style="font-size:40px">⚠️</div>
          <strong>Gagal membuka katalog</strong>
          <div style="max-width:520px;color:#bbb;font-size:13px">
            Pastikan file <b>katalog.pdf</b> berada satu folder dengan <b>index.html</b>.
          </div>
        `;
      }
    }

    prevBtn.addEventListener("click", () => flipbook?.flipPrev());
    nextBtn.addEventListener("click", () => flipbook?.flipNext());

    fullscreenBtn.addEventListener("click", async () => {
      const target = document.documentElement;
      if (!document.fullscreenElement) {
        await target.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    });

    init();
  </script>
</body>
</html>
