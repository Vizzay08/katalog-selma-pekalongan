}

}

#counter{
  min-width:110px;

  font-size:13px;

}

.hint{
  margin-top:9px;
  color:#cfcfcf;
  font-size:11px;
  text-align:center;
}

.footer{
  margin-top:14px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;

  color:#ddd;

.footer a{

/* ================= LOADING ================= */

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const status = document.getElementById("status");
const statusText = document.getElementById("statusText");
const bookEl = document.getElementById("book");
const counter = document.getElementById("counter");

let flipbook;
let totalPages = 0;

function setStatus(text){
  statusText.textContent = text;
}

function updateCounter(pageNumber){
  counter.textContent = `Halaman ${pageNumber} / ${totalPages}`;
}

async function renderPage(pdf, num, canvas){
  const page = await pdf.getPage(num);
  const base = page.getViewport({scale:1});

  const scale = Math.min(
    2,
    Math.max(1.2, 1050 / base.width)
  );

  const viewport = page.getViewport({scale});
  const ratio = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(viewport.width * ratio);
  canvas.height = Math.floor(viewport.height * ratio);

  const ctx = canvas.getContext("2d", {alpha:false});

  ctx.setTransform(ratio,0,0,ratio,0,0);

  await page.render({
    canvasContext:ctx,
    viewport
  }).promise;
}

async function init(){

  try{

    setStatus("Membuka katalog PDF…");

    const pdf = await pdfjsLib
      .getDocument("katalog.pdf")
      .promise;

    totalPages = pdf.numPages;

    const pages = [];

    for(let i = 1; i <= totalPages; i++){

      const page = document.createElement("div");
      page.className = "page";

      const canvas = document.createElement("canvas");

      page.appendChild(canvas);
      bookEl.appendChild(page);

      pages.push({
        page,
        canvas,
        num:i
      });
    }

    for(let i = 0; i < pages.length; i++){

      await renderPage(
        pdf,
        pages[i].num,
        pages[i].canvas
      );

      setStatus(
        `Menyiapkan halaman ${i + 1} / ${totalPages}…`
      );
    }

    const rect = bookEl.getBoundingClientRect();

    const ratio = 1.414;

    const pageWidth = Math.max(
      280,
      Math.floor(
        Math.min(
          rect.width / 2,
          rect.height / ratio
        )
      )
    );

    flipbook = new St.PageFlip(
      bookEl,
      {
        width:pageWidth,
        height:Math.floor(pageWidth * ratio),
        size:"stretch",

        minWidth:280,
        maxWidth:900,

        minHeight:396,
        maxHeight:1273,

        maxShadowOpacity:.35,
        showCover:true,
        mobileScrollSupport:true,
        useMouseEvents:true,
        drawShadow:true,
        flippingTime:700,
        startPage:0
      }
    );

    flipbook.loadFromHTML(
      document.querySelectorAll(".page")
    );

    flipbook.on("flip", e => {
      updateCounter(e.data + 1);
    });

    updateCounter(1);

    status.style.display = "none";

  }catch(error){

    console.error(error);

    status.innerHTML = `
      <div style="font-size:40px">⚠️</div>
      <strong>Gagal membuka katalog</strong>
      <div style="color:#bbb;font-size:13px">
        Pastikan index.html dan katalog.pdf berada di folder yang sama.
      </div>
    `;
  }
}

document.getElementById("prevBtn").onclick = () => {
  flipbook?.flipPrev();
};

document.getElementById("nextBtn").onclick = () => {
  flipbook?.flipNext();
};

document.getElementById("fullscreenBtn").onclick = async () => {

  if(!document.fullscreenElement){
    await document.documentElement.requestFullscreen?.();
  }else{
    await document.exitFullscreen?.();
  }

};

init();
</script>
