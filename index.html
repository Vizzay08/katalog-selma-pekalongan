<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELMA Transmart Pekalongan — Katalog 2026</title>
<meta name="description" content="Katalog Produk 2026 SELMA Transmart Pekalongan LT 1">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:linear-gradient(135deg,#23070b,#4a1017 55%,#170306);color:#fff}
.topbar{
  min-height:70px;padding:10px 18px;display:flex;align-items:center;
  justify-content:space-between;gap:15px;background:rgba(117,18,29,.96);
  border-bottom:1px solid rgba(255,255,255,.15);box-shadow:0 3px 18px #0008;
  position:sticky;top:0;z-index:30
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:45px;height:45px;border-radius:50%;background:#fff;color:#a91f2b;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;
  box-shadow:0 2px 8px #0004
}
.name{font-size:18px;font-weight:800;letter-spacing:.5px}
.location{font-size:11px;margin-top:3px;opacity:.9}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:0;border-radius:8px;padding:9px 12px;text-decoration:none;
  cursor:pointer;font-weight:700;font-size:12px;background:#fff;color:#8d1d28;
}
.btn.primary{background:#19a85a;color:#fff}
.btn.dark{background:#2b2b2b;color:#fff}
.viewer{min-height:calc(100vh - 70px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:20px 12px 25px}
#book{width:min(94vw,1100px);height:min(78vh,760px);min-height:390px;margin:auto}
.page{background:#fff;overflow:hidden;box-shadow:0 0 15px #0006}
.page canvas{width:100%;height:100%;display:block;background:#fff}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:15px;flex-wrap:wrap}
.controls button{min-width:105px}
#counter{min-width:110px;text-align:center;font-size:12px;color:#ddd}
.hint{margin-top:9px;color:#bbb;font-size:11px;text-align:center}
.footer{
  margin-top:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  justify-content:center;font-size:11px;color:#ddd
}
.footer a{color:#fff;text-decoration:none;font-weight:700}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#180407;z-index:50;flex-direction:column;gap:12px;text-align:center;padding:20px}
.spinner{width:42px;height:42px;border:4px solid #5b3035;border-top-color:#fff;
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){
  .topbar{min-height:62px;padding:8px 10px}
  .logo{width:38px;height:38px;font-size:17px}
  .name{font-size:14px}.location{font-size:9px}
  .btn{padding:7px 8px;font-size:10px}
  #book{width:96vw;height:72vh;min-height:340px}
  .viewer{padding-top:12px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">S</div>
    <div>
      <div class="name">SELMA</div>
      <div class="location">TRANSMART PEKALONGAN LT 1</div>
    </div>
  </div>
  <div class="actions">
    <a class="btn primary" href="https://wa.me/62818110166" target="_blank" rel="noopener">💬 WhatsApp</a>
    <a class="btn" href="https://www.instagram.com/selma.pekalongan/" target="_blank" rel="noopener">📸 Instagram</a>
    <a class="btn dark" href="katalog.pdf" target="_blank" rel="noopener">📄 PDF</a>
    <button class="btn" id="fullscreenBtn" type="button">⛶ Fullscreen</button>
  </div>
</header>

<main class="viewer">
  <div id="book"></div>
  <div class="controls">
    <button class="btn" id="prevBtn" type="button">‹ Sebelumnya</button>
    <span id="counter">Memuat…</span>
    <button class="btn" id="nextBtn" type="button">Berikutnya ›</button>
  </div>
  <div class="hint">Klik atau geser halaman untuk membalik seperti buku.</div>
  <div class="footer">
    <span>SELMA Transmart Pekalongan LT 1</span>
    <span>•</span>
    <a href="https://wa.me/62818110166" target="_blank" rel="noopener">+62 818-110-166</a>
    <span>•</span>
    <a href="https://www.instagram.com/selma.pekalongan/" target="_blank" rel="noopener">@selma.pekalongan</a>
  </div>
</main>

<div id="status">
  <div class="spinner"></div>
  <div id="statusText">Menyiapkan katalog…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const status=document.getElementById("status");
const statusText=document.getElementById("statusText");
const bookEl=document.getElementById("book");
const counter=document.getElementById("counter");
let flipbook,totalPages=0;

function setStatus(t){statusText.textContent=t}
function updateCounter(n){counter.textContent=`Halaman ${n} / ${totalPages}`}

async function renderPage(pdf,num,canvas){
  const page=await pdf.getPage(num);
  const base=page.getViewport({scale:1});
  const scale=Math.min(2,Math.max(1.2,1050/base.width));
  const viewport=page.getViewport({scale});
  const ratio=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(viewport.width*ratio);
  canvas.height=Math.floor(viewport.height*ratio);
  const ctx=canvas.getContext("2d",{alpha:false});
  ctx.setTransform(ratio,0,0,ratio,0,0);
  await page.render({canvasContext:ctx,viewport}).promise;
}

async function init(){
  try{
    setStatus("Membuka katalog PDF…");
    const pdf=await pdfjsLib.getDocument("katalog.pdf").promise;
    totalPages=pdf.numPages;
    const pages=[];
    for(let i=1;i<=totalPages;i++){
      const page=document.createElement("div");
      page.className="page";
      const canvas=document.createElement("canvas");
      page.appendChild(canvas);bookEl.appendChild(page);
      pages.push({page,canvas,num:i});
    }
    for(let i=0;i<pages.length;i++){
      await renderPage(pdf,pages[i].num,pages[i].canvas);
      setStatus(`Menyiapkan halaman ${i+1} / ${totalPages}…`);
    }
    const rect=bookEl.getBoundingClientRect();
    const ratio=1.414;
    const pageWidth=Math.max(280,Math.floor(Math.min(rect.width/2,rect.height/ratio)));
    flipbook=new St.PageFlip(bookEl,{
      width:pageWidth,height:Math.floor(pageWidth*ratio),size:"stretch",
      minWidth:280,maxWidth:900,minHeight:396,maxHeight:1273,
      maxShadowOpacity:.35,showCover:true,mobileScrollSupport:true,
      useMouseEvents:true,drawShadow:true,flippingTime:700,startPage:0
    });
    flipbook.loadFromHTML(document.querySelectorAll(".page"));
    flipbook.on("flip",e=>updateCounter(e.data+1));
    updateCounter(1);status.style.display="none";
  }catch(e){
    console.error(e);
    status.innerHTML="<div style='font-size:40px'>⚠️</div><strong>Gagal membuka katalog</strong><div style='color:#bbb;font-size:13px'>Pastikan index.html dan katalog.pdf berada di folder yang sama.</div>";
  }
}
document.getElementById("prevBtn").onclick=()=>flipbook?.flipPrev();
document.getElementById("nextBtn").onclick=()=>flipbook?.flipNext();
document.getElementById("fullscreenBtn").onclick=async()=>{
  if(!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
  else await document.exitFullscreen?.();
};
init();
</script>
</body>
</html>
